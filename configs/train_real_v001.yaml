# Real greenhouse fine-tuning/training configuration.
# Fill dataset_real_v001 with audited real data before using this config.

project:
  name: watermelon_real_v001_multimodal
  description: Real greenhouse watermelon multimodal four-task model
  seed: 42

data:
  dataset_dir: dataset_real_v001
  split_file: dataset_real_v001/split.csv
  image_size: [224, 224]
  window_hours: 24
  preserve_aspect_ratio: true
  train_augmentation: true
  strict_time_alignment: true
  require_device_id: true
  require_task_masks: false
  environment_fields:
    - temperature
    - soil_humidity
    - light
    - ph
  optional_environment_fields: []
  environment_normalization: auto
  splits:
    train: train
    validation: val
    test: test

model:
  input_mode: multimodal
  image_backbone: resnet50
  image_pretrained: true
  environment_encoder: transformer
  sensor_dim: 4
  time_feature_dim: 1
  use_sensor_mask: true
  output_tasks:
    growth_stage: 6
    health_level: 4
    maturity_level: 4
    abnormal_alert: 2

training:
  epochs: 30
  batch_size: 8
  learning_rate: 0.00005
  weight_decay: 0.0001
  num_workers: 0
  device: auto
  grad_clip_norm: 1.0
  scheduler: cosine
  min_learning_rate: 0.000001
  early_stopping_patience: 7

loss:
  type: cross_entropy
  label_smoothing: 0.03
  task_weights:
    growth_stage: 1.0
    health_level: 1.2
    maturity_level: 1.0
    abnormal_alert: 1.2

outputs:
  checkpoint_dir: checkpoints/real_v001
  best_checkpoint: checkpoints/real_v001/best_model.pth
  last_checkpoint: checkpoints/real_v001/last_model.pth
  evaluation_dir: outputs/real_v001
  experiment_dir: experiments/real_v001
