project:
  name: watermelon_enhanced_multimodal_fused
  description: Original multimodal model with robust V4 data and training mechanisms
  seed: 42

data:
  dataset_dir: dataset_fused
  labels_file: dataset_fused/labels_masked.csv
  split_file: dataset_fused/split_source_aware.csv
  image_size: [224, 224]
  window_hours: 24
  preserve_aspect_ratio: true
  train_augmentation: true
  strict_time_alignment: true
  require_device_id: false
  require_task_masks: true
  environment_fields:
    - temperature
    - soil_humidity
    - light
    - ph
  optional_environment_fields: []
  environment_normalization: auto
  splits:
    train: train
    validation: val
    test: test

model:
  input_mode: multimodal
  image_backbone: resnet50
  image_pretrained: true
  environment_encoder: transformer
  sensor_dim: 4
  time_feature_dim: 1
  use_sensor_mask: true
  output_tasks:
    growth_stage: 6
    health_level: 4
    maturity_level: 4
    abnormal_alert: 2

training:
  epochs: 30
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  device: auto
  grad_clip_norm: 1.0
  scheduler: cosine
  min_learning_rate: 0.000001
  early_stopping_patience: 5

loss:
  type: cross_entropy
  label_smoothing: 0.05
  task_weights:
    growth_stage: 1.0
    health_level: 1.0
    maturity_level: 1.0
    abnormal_alert: 1.0

outputs:
  checkpoint_dir: checkpoints/enhanced_fused_multimodal
  best_checkpoint: checkpoints/enhanced_fused_multimodal/best_model.pth
  last_checkpoint: checkpoints/enhanced_fused_multimodal/last_model.pth
  evaluation_dir: outputs/enhanced_fused_multimodal
  experiment_dir: experiments/enhanced_fused_multimodal
