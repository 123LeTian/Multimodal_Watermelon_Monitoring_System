# Watermelon multimodal model training configuration.
#
# scripts/train.py reads this file when called with --config. Command-line
# arguments override values from this file.

project:
  name: watermelon_multimodal_monitoring
  description: ResNet50 + Transformer multi-task classification model
  seed: 42

data:
  dataset_dir: dataset_sample
  image_size: [224, 224]
  window_hours: 24
  environment_fields:
    - temperature
    - soil_humidity
    - light
    - ph
  splits:
    train: train
    validation: val
    test: test

model:
  image_backbone: resnet50
  image_pretrained: false
  environment_encoder: transformer
  sensor_dim: 4
  time_feature_dim: 1
  output_tasks:
    growth_stage: 6
    health_level: 4
    maturity_level: 4
    abnormal_alert: 2

training:
  epochs: 30
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  device: auto

loss:
  type: cross_entropy
  label_smoothing: 0.0
  task_weights:
    growth_stage: 1.0
    health_level: 1.0
    maturity_level: 1.0
    abnormal_alert: 1.0

outputs:
  checkpoint_dir: checkpoints
  best_checkpoint: checkpoints/best_model.pth
  last_checkpoint: checkpoints/last_model.pth
  evaluation_dir: outputs
  experiment_dir: experiments
