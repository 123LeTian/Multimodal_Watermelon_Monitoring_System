project:
  name: watermelon_multimodal_monitoring
  description: ResNet50 + Transformer multi-task classification model
  seed: 42
data:
  dataset_dir: dataset_fused
  split_file: dataset_fused\split_source_aware.csv
  image_size:
  - 224
  - 224
  window_hours: 24
  environment_fields:
  - temperature
  - soil_humidity
  - light
  - ph
  splits:
    train: train
    validation: val
    test: test
  labels_file: dataset_fused\labels_masked.csv
model:
  input_mode: multimodal
  image_backbone: resnet50
  image_pretrained: false
  environment_encoder: transformer
  sensor_dim: 4
  time_feature_dim: 1
  output_tasks:
    growth_stage: 6
    health_level: 4
    maturity_level: 4
    abnormal_alert: 2
training:
  epochs: 30
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  device: auto
loss:
  type: cross_entropy
  label_smoothing: 0.05
  task_weights:
    growth_stage: 1.0
    health_level: 1.0
    maturity_level: 1.0
    abnormal_alert: 1.0
outputs:
  checkpoint_dir: checkpoints\exp007_masked_multitask_training
  best_checkpoint: checkpoints\exp007_masked_multitask_training\best_model.pth
  last_checkpoint: checkpoints\exp007_masked_multitask_training\last_model.pth
  evaluation_dir: outputs
  experiment_dir: experiments
